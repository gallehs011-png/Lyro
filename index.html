<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETHER — Liquid Glass Music Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-highlight: rgba(255, 255, 255, 0.35);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.62);
      --blob-1: #6366f1;
      --blob-2: #ec4899;
      --blob-3: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060711;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    /* LIVING LIQUID BACKGROUND */
    .liquid-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 20%, #11132b 0%, #05060d 100%);
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatLiquid 14s infinite alternate ease-in-out;
    }
    .blob-1 { width: 320px; height: 320px; background: var(--blob-1); top: -50px; left: -50px; }
    .blob-2 { width: 280px; height: 280px; background: var(--blob-2); bottom: 5%; right: -50px; animation-delay: -4s; }
    .blob-3 { width: 240px; height: 240px; background: var(--blob-3); top: 45%; left: 15%; animation-delay: -8s; }

    @keyframes floatLiquid {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -35px) scale(1.1); }
    }

    /* APP CONTAINER */
    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      padding: 20px 18px 120px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .liquid-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), inset 0 1px 1px var(--glass-highlight);
    }

    /* HEADER */
    .top-bar { display: flex; align-items: center; justify-content: space-between; }
    .brand-title { font-size: 1.2rem; font-weight: 800; letter-spacing: 1.5px; color: #fff; }
    .status-pill { padding: 5px 12px; border-radius: 99px; font-size: 0.7rem; font-weight: 600; color: #a5f3fc; }

    /* SEARCH */
    .search-wrapper { border-radius: 24px; padding: 4px; }
    .search-inner { display: flex; align-items: center; padding: 8px 14px; gap: 10px; }
    .search-input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: 0.95rem; }
    .search-input::placeholder { color: rgba(255,255,255,0.4); }

    /* SUGGESTION PILLS */
    .chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip {
      padding: 8px 14px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--text-muted);
      border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); transition: 0.2s;
    }
    .chip:hover, .chip.active { color: #fff; background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }

    /* STATUS / LOADING BANNER */
    .info-banner {
      padding: 14px; border-radius: 20px; font-size: 0.85rem; text-align: center; color: #7dd3fc; font-weight: 600;
    }

    /* PLAYER MODAL / PANEL */
    .player-card {
      border-radius: 32px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 10px;
    }

    .album-frame {
      padding: 10px;
      border-radius: 30px;
    }

    .album-art {
      width: 200px;
      height: 200px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .track-meta { text-align: center; width: 100%; }
    .track-title { font-size: 1.15rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .track-artist { font-size: 0.85rem; color: #7dd3fc; font-weight: 600; }

    /* LYRICS CONTAINER */
    .lyrics-container {
      width: 100%;
      height: 120px;
      overflow-y: auto;
      text-align: center;
      padding: 10px;
      border-radius: 16px;
      background: rgba(0,0,0,0.2);
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      scroll-behavior: smooth;
    }
    .lyrics-container::-webkit-scrollbar { display: none; }
    .lyric-line.active { color: #fff; font-weight: 700; transform: scale(1.03); text-shadow: 0 0 10px rgba(56,189,248,0.6); }

    /* CONTROLS */
    .controls-row { display: flex; align-items: center; gap: 20px; width: 100%; justify-content: center; margin-top: 5px; }
    .ctrl-btn {
      width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.15); color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer; transition: 0.2s;
    }
    .ctrl-btn:active { transform: scale(0.9); }
    .ctrl-btn.main { width: 64px; height: 64px; background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1)); box-shadow: 0 8px 25px rgba(56,189,248,0.3); }

    audio { display: none; }
  </style>
</head>
<body>

  <!-- BACKGROUND CAIR -->
  <div class="liquid-canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container">
    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="brand-title">✦ AETHER</div>
      <div class="status-pill liquid-glass">FULL AUDIO DEMO</div>
    </header>

    <!-- SEARCH BAR -->
    <div class="search-wrapper liquid-glass">
      <div class="search-inner">
        <svg width="18" height="18" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Cari lagu apa saja (Indo / Luar)..." value="Tulus Hati Hati Di Jalan" />
      </div>
    </div>

    <!-- QUICK CHIPS -->
    <div class="chip-scroll">
      <div class="chip active" onclick="quickSearch('Tulus Hati Hati Di Jalan')">Tulus</div>
      <div class="chip" onclick="quickSearch('Laufey From The Start')">Laufey</div>
      <div class="chip" onclick="quickSearch('Bernadya Sialnya Hidup Harus Berjalan')">Bernadya</div>
      <div class="chip" onclick="quickSearch('SZA SNOOZE')">SZA</div>
    </div>

    <!-- PLAYER CARD -->
    <section class="player-card liquid-glass">
      <div class="album-frame liquid-glass">
        <img id="albumArt" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80" class="album-art" alt="Art" />
      </div>

      <div class="track-meta">
        <div class="track-title" id="trackTitle">Ketik lagu & klik putar</div>
        <div class="track-artist" id="trackArtist">Full Audio Stream</div>
      </div>

      <!-- LIRIK KOTAK -->
      <div class="lyrics-container" id="lyricsBox">
        <div class="lyric-line active">Lirik akan muncul otomatis di sini...</div>
      </div>

      <!-- KONTROL TOMBOL -->
      <div class="controls-row">
        <button class="ctrl-btn main" id="playBtn" onclick="togglePlay()">▶</button>
      </div>
    </section>

    <div class="info-banner" id="infoBanner">
      Mengambil stream audio full gratis via Invidious API...
    </div>
  </main>

  <audio id="audioEngine"></audio>

  <script>
    const audioEngine = document.getElementById('audioEngine');
    const playBtn = document.getElementById('playBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const albumArt = document.getElementById('albumArt');
    const lyricsBox = document.getElementById('lyricsBox');
    const infoBanner = document.getElementById('infoBanner');
    const searchInput = document.getElementById('searchInput');

    let currentAudioUrl = "";

    // Daftar server publik Invidious cadangan yang aktif
    const invidiousInstances = [
      "https://vid.puffyan.us",
      "https://invidious.privacyredirect.com",
      "https://inv.nadeko.net"
    ];

    async function fetchInvidious(endpoint) {
      for (let base of invidiousInstances) {
        try {
          const res = await fetch(`${base}${endpoint}`);
          if (res.ok) return await res.json();
        } catch (e) {
          console.warn(`Gagal di server ${base}, mencoba cadangan...`);
        }
      }
      throw new Error("Semua server musik sedang sibuk.");
    }

    async function quickSearch(query) {
      searchInput.value = query;
      loadMusic(query);
    }

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loadMusic(e.target.value);
      }
    });

    async function loadMusic(keyword) {
      if (!keyword) return;
      infoBanner.textContent = "🔍 Sedang mencari lagu full...";
      trackTitle.textContent = "Memuat...";
      trackArtist.textContent = keyword;

      try {
        // 1. Cari video via Invidious API
        const searchData = await fetchInvidious(`/api/v1/search?q=${encodeURIComponent(keyword)}&type=video`);
        if (!searchData.length) {
          infoBanner.textContent = "❌ Lagu tidak ditemukan.";
          return;
        }

        const topResult = searchData[0];
        const videoId = topResult.videoId;
        const title = topResult.title;
        const uploader = topResult.author;

        trackTitle.textContent = title;
        trackArtist.textContent = uploader;
        if (topResult.videoThumbnails && topResult.videoThumbnails.length > 0) {
          albumArt.src = topResult.videoThumbnails[topResult.videoThumbnails.length - 1].url;
        }

        infoBanner.textContent = "⚡ Menyiapkan stream audio full...";

        // 2. Ambil detail stream audio
        const streamData = await fetchInvidious(`/api/v1/videos/${videoId}`);
        const audioStreams = streamData.adaptiveFormats.filter(f => f.type && f.type.includes('audio'));
        
        if (audioStreams.length > 0) {
          // Ambil kualitas audio terbaik
          currentAudioUrl = audioStreams[audioStreams.length - 1].url;
          audioEngine.src = currentAudioUrl;
          audioEngine.play();
          playBtn.textContent = "⏸";
          infoBanner.textContent = "🎶 Memutar audio durasi penuh!";
        } else {
          infoBanner.textContent = "❌ Format audio tidak tersedia.";
        }

        // 3. Ambil Lirik dari LRCLIB API
        fetchLyrics(title, uploader);

      } catch (err) {
        console.error(err);
        infoBanner.textContent = "⚠️ Gagal memuat server musik. Coba lagi.";
      }
    }

    async function fetchLyrics(title, artist) {
      lyricsBox.innerHTML = `<div class="lyric-line active">Memuat lirik...</div>`;
      try {
        const cleanTitle = title.replace(/\(.*?\)|\[.*?\]/g, '').trim();
        const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle + ' ' + artist)}`);
        const data = await res.json();

        if (data.length > 0 && data[0].plainLyrics) {
          const lines = data[0].plainLyrics.split('\n');
          lyricsBox.innerHTML = lines.map(l => `<div class="lyric-line">${l || '♪'}</div>`).join('');
        } else {
          lyricsBox.innerHTML = `<div class="lyric-line active">Lirik teks tidak ditemukan.</div>`;
        }
      } catch (e) {
        lyricsBox.innerHTML = `<div class="lyric-line active">Gagal memuat lirik.</div>`;
      }
    }

    function togglePlay() {
      if (audioEngine.paused) {
        if (audioEngine.src) {
          audioEngine.play();
          playBtn.textContent = "⏸";
        } else {
          loadMusic(searchInput.value);
        }
      } else {
        audioEngine.pause();
        playBtn.textContent = "▶";
      }
    }

    // Auto load lagu pertama saat dibuka
    window.onload = () => {
      loadMusic("Tulus Hati Hati Di Jalan");
    };
  </script>
</body>
</html>
